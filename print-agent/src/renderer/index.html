<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>OmniSeller · Agen Cetak</title><link rel="stylesheet" href="app.css"><script src="renderer.js" defer></script></head>
<body><main>
<header><div class="brand"><span class="mark" aria-hidden="true">O</span><div><strong>OmniSeller</strong><span data-i18n="agentLabel">{{agentLabel}}</span></div></div><span id="connection" class="badge"></span></header>
<div id="notice" role="alert" hidden></div>
<section id="pairing" class="card"><p class="eyebrow" data-i18n="eyebrow">{{eyebrow}}</p><h1 data-i18n="pairTitle">{{pairTitle}}</h1><p class="muted" data-i18n="subtitle">{{subtitle}}</p>
<form id="pair-form"><label for="origin" data-i18n="origin">{{origin}}</label><input id="origin" type="url" autocomplete="url" required placeholder="https://api.omniseller.id" aria-describedby="origin-hint"><small id="origin-hint" data-i18n="originHint">{{originHint}}</small>
<label for="token" data-i18n="token">{{token}}</label><input id="token" type="password" autocomplete="off" spellcheck="false" minlength="43" maxlength="43" required aria-describedby="token-hint"><small id="token-hint" data-i18n="tokenHint">{{tokenHint}}</small>
<button id="pair-button" class="primary wide" type="submit" data-i18n="pair">{{pair}}</button></form><p class="security" data-i18n="securityNote">{{securityNote}}</p></section>
<div id="paired" hidden><section class="card compact"><div class="section-heading"><div><p class="eyebrow" data-i18n="eyebrow">{{eyebrow}}</p><h1 id="agent-name">{{app}}</h1></div></div><div class="actions"><button id="pause" type="button"></button><button id="refresh" type="button" data-i18n="refresh">{{refresh}}</button></div></section>
<section class="card"><details id="settings"><summary data-i18n="printersTitle">{{printersTitle}}</summary><small id="printer-summary"></small><p id="no-printers" class="muted" data-i18n="noPrinters" hidden>{{noPrinters}}</p><form id="printers-form"><label for="computer-name" data-i18n="computerName">{{computerName}}</label><input id="computer-name" maxlength="80" required><label for="label-printer" data-i18n="labelPrinter">{{labelPrinter}}</label><select id="label-printer"></select><label for="document-printer" data-i18n="documentPrinter">{{documentPrinter}}</label><select id="document-printer"></select><button type="submit" class="wide" data-i18n="savePrinters">{{savePrinters}}</button><small id="saved" role="status"></small></form><button id="test-print" type="button" class="wide" data-i18n="testPrint">{{testPrint}}</button></details></section>
<section class="card activity"><div class="section-heading"><h2 data-i18n="queueTitle">{{queueTitle}}</h2><span id="queue-count" class="counter"></span></div><div id="empty"><span class="empty-icon" aria-hidden="true">✓</span><h3 data-i18n="emptyTitle">{{emptyTitle}}</h3><p class="muted" data-i18n="empty">{{empty}}</p></div><ul id="jobs" aria-live="polite" aria-relevant="additions text"></ul></section>
<button id="unpair" class="link danger" type="button" data-i18n="unpair">{{unpair}}</button></div>
<footer><p data-i18n="footer">{{footer}}</p><div><span id="version"></span><button id="update" class="link" type="button" data-i18n="updates">{{updates}}</button></div><p id="update-status" role="status"></p><button id="quit" class="link" type="button" data-i18n="quit">{{quit}}</button></footer>
</main><dialog id="confirm"><form method="dialog"><p id="confirm-text"></p><div class="actions"><button type="submit" value="no" data-i18n="cancel">{{cancel}}</button><button type="submit" value="yes" class="primary" data-i18n="confirmAction">{{confirmAction}}</button></div></form></dialog></body></html>
